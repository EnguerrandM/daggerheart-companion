<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <!-- Indispensable sur mobile : sans ça, le téléphone affiche la page "dézoomée" comme un site de PC -->
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Daggerheart Companion</title>
  <style>
    body {
      font-family: system-ui, sans-serif;
      background: #1a1625;
      color: #eee;
      margin: 0;
      padding: 1.5rem;
    }
    h1 { color: #d4af37; }
    .fiche {
      background: #2a2438;
      border-radius: 12px;
      padding: 1rem;
    }
    .fiche h2 { margin-top: 0; }
    .fiche h3 { color: #d4af37; margin-bottom: 0.3rem; }
    .ressource {
      display: flex;          /* éléments alignés sur une ligne */
      align-items: center;
      gap: 0.6rem;
      margin: 0.5rem 0;
    }
    .carte-perso {
      display: flex;
      flex-direction: column;   /* empile nom / classe / ressources */
      gap: 0.25rem;
      width: 100%;
      text-align: left;
      margin-bottom: 0.75rem;
      padding: 1rem;
      border: none;
      border-radius: 12px;
      background: #2a2438;
      color: #eee;
      font-size: 1rem;
    }
    .carte-perso strong { font-size: 1.2rem; color: #d4af37; }
    .retour {
      margin-bottom: 0.75rem;
      padding: 0.6rem 1rem;
      border: 1px solid #d4af37;
      border-radius: 8px;
      background: none;
      color: #d4af37;
      font-size: 1rem;
    }
    .ajouter, .supprimer {
      width: 100%;
      padding: 0.9rem;
      border-radius: 12px;
      font-size: 1rem;
      background: none;
    }
    .ajouter { border: 2px dashed #d4af37; color: #d4af37; }
    .supprimer { margin-top: 1.5rem; border: 1px solid #c0504d; color: #e07b78; }
    .barre { display: flex; justify-content: space-between; }
    .champ {
      display: flex;
      flex-direction: column;
      gap: 0.25rem;
      margin-bottom: 0.75rem;
      color: #d4af37;
      font-size: 0.9rem;
    }
    .champ input {
      padding: 0.6rem;
      border: 1px solid #554a6e;
      border-radius: 8px;
      background: #1a1625;
      color: #eee;
      font-size: 1rem;   /* 16px mini : en dessous, Chrome/Safari zooment au focus */
    }
    .ressource .label { width: 4.5rem; }
    .ressource .valeur { min-width: 3.5rem; text-align: center; }
    .ressource button {
      width: 2.75rem;         /* assez gros pour un pouce */
      height: 2.75rem;
      font-size: 1.4rem;
      border: none;
      border-radius: 8px;
      background: #d4af37;
      color: #1a1625;
    }
  </style>
</head>
<body>
  <h1>Daggerheart Companion</h1>

  <!-- Zone vide : app.js va la remplir avec la fiche du personnage -->
  <div id="app"></div>

  <!-- On charge le script. "defer" = attendre que la page soit construite
       avant de l'exécuter, sinon il ne trouverait pas <div id="app"> -->
  <!-- ?v=2 : numéro de version. Le changer force le navigateur à
       recharger app.js au lieu de servir sa vieille copie en cache. -->
  <script src="app.js?v=7" defer></script>
</body>
</html>
