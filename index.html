<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <!-- Indispensable sur mobile : sans ça, le téléphone affiche la page "dézoomée" comme un site de PC -->
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Daggerheart Companion</title>
  <style>
    body {
      font-family: system-ui, sans-serif;
      background: #1a1625;
      color: #eee;
      margin: 0;
      padding: 1.5rem;
    }
    h1 { color: #d4af37; }
    .fiche {
      background: #2a2438;
      border-radius: 12px;
      padding: 1rem;
    }
    .fiche h2 { margin-top: 0; }
    .fiche h3 { color: #d4af37; margin-bottom: 0.3rem; }
  </style>
</head>
<body>
  <h1>Daggerheart Companion</h1>

  <!-- Zone vide : app.js va la remplir avec la fiche du personnage -->
  <div id="app"></div>

  <!-- On charge le script. "defer" = attendre que la page soit construite
       avant de l'exécuter, sinon il ne trouverait pas <div id="app"> -->
  <script src="app.js" defer></script>
</body>
</html>
