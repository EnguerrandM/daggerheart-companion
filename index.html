<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <!-- Indispensable sur mobile : sans ça, le téléphone affiche la page "dézoomée" comme un site de PC -->
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- Couleur de la barre d'adresse / barre système sur Android -->
  <meta name="theme-color" content="#121315">
  <!-- Carte d'identité de l'appli (nom, icône, couleurs) : permet de l'installer -->
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icones/icone-192.png">
  <title>Duality Companion</title>
  <style>
    /* ===== PALETTE =====
       Variables CSS (= Material Parameter Collection) : on change une
       couleur ICI et toute l'app suit. Usage : var(--accent). */
    :root {
      /* Thème ARGENT + OR (?v=42) : base neutre grise ; l'argent pour ce
         qu'on touche (boutons, valeurs), l'or pour les titres et la fiche
         de perso. Ancien thème sarcelle + or : historique Git (?v=40). */
      --fond:         #141518;   /* gris presque noir */
      --fond-halo:    #33373d;   /* halos "nébuleuse" du fond */
      --fond-halo-2:  #24272b;
      --carte:        rgba(38, 40, 45, 0.82);  /* cartes légèrement translucides */
      --carte-creux:  #191a1e;   /* fond des champs de saisie */
      --bordure:      #4a4f57;
      --accent:       #e1e6ec;   /* argent lumineux */
      --accent-clair: #ffffff;
      --or:           #d9b96e;   /* or : titres + fiche de perso */
      --or-clair:     #f3dfa6;
      --texte:        #f0f0f0;
      --texte-doux:   #b6bcc4;
      --danger:       #e09478;   /* terracotta */
    }

    body {
      font-family: system-ui, sans-serif;
      color: var(--texte);
      margin: 0;
      padding: 1.5rem;
      min-height: 100vh;
      box-sizing: border-box;
      /* Plusieurs fonds empilés : deux halos flous + la couleur de base.
         radial-gradient = dégradé circulaire (≈ un Radial Gradient en matériau). */
      background:
        radial-gradient(ellipse at 85% 5%,  var(--fond-halo) 0%, transparent 55%),
        radial-gradient(ellipse at 10% 95%, var(--fond-halo-2) 0%, transparent 50%),
        var(--fond);
    }
    h1 { color: var(--or); letter-spacing: 0.04em; }
    h2 { color: var(--or-clair); }
    .fiche {
      background: var(--carte);
      border: 1px solid var(--bordure);
      border-radius: 12px;
      padding: 1rem;
    }
    /* La FICHE DE PERSO (jeu, correction MJ, création) : bordure dorée. */
    .fiche-perso { border-color: var(--or); }
    .fiche h2 { margin-top: 0; }
    .fiche h3 { color: var(--or); margin-bottom: 0.3rem; }
    .ressource {
      display: flex;          /* éléments alignés sur une ligne */
      align-items: center;
      gap: 0.6rem;
      margin: 0.5rem 0;
    }
    .carte-perso {
      display: flex;
      flex-direction: column;   /* empile nom / classe / ressources */
      gap: 0.25rem;
      width: 100%;
      text-align: left;
      margin-bottom: 0.75rem;
      padding: 1rem;
      border: 1px solid var(--bordure);
      border-radius: 12px;
      background: var(--carte);
      color: var(--texte-doux);
      font-size: 1rem;
    }
    .carte-perso strong { font-size: 1.2rem; color: var(--or); }
    .retour {
      margin-bottom: 0.75rem;
      padding: 0.6rem 1rem;
      border: 1px solid var(--accent);
      border-radius: 8px;
      background: none;
      color: var(--accent);
      font-size: 1rem;
    }
    .ajouter, .supprimer {
      width: 100%;
      padding: 0.9rem;
      border-radius: 12px;
      font-size: 1rem;
      background: none;
    }
    .ajouter { border: 2px dashed var(--accent); color: var(--accent); }
    .supprimer { margin-top: 1.5rem; border: 1px solid var(--danger); color: var(--danger); }
    .barre { display: flex; justify-content: space-between; }
    .fichiers { margin-top: 1.5rem; }
    .champ {
      display: flex;
      flex-direction: column;
      gap: 0.25rem;
      margin-bottom: 0.75rem;
      color: var(--accent);
      font-size: 0.9rem;
    }
    .champ input, .champ select, .champ textarea {
      padding: 0.6rem;
      border: 1px solid var(--bordure);
      border-radius: 8px;
      background: var(--carte-creux);
      color: var(--texte);
      font-size: 1rem;   /* 16px mini : en dessous, Chrome/Safari zooment au focus */
    }
    .ressource .label { width: 6rem; }   /* assez large pour "Knowledge" / "Stress max" */
    .ressource .valeur { min-width: 3.5rem; text-align: center; }
    .ressource button {
      width: 2.75rem;         /* assez gros pour un pouce */
      height: 2.75rem;
      font-size: 1.4rem;
      border: none;
      border-radius: 8px;
      /* argent "métal" : dégradé clair en haut, plus sombre en bas */
      background: linear-gradient(180deg, #ffffff 0%, var(--accent) 45%, #a9b1ba 100%);
      color: var(--fond);
    }
    /* ===== Défense (V0.4) ===== */
    /* Seuils : [1] 7 [2] 14 [3], centrés */
    .seuils {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 0.5rem;
      margin: 0.6rem 0;
    }
    /* Seuil dans une case dorée ; nombre de PV en petit, entre les cases */
    .case-seuil {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 2.6rem;
      height: 2.6rem;
      padding: 0 0.3rem;
      box-sizing: border-box;
      border: 2px solid var(--or);
      border-radius: 8px;
      background: var(--carte-creux);
      color: var(--or-clair);
      font-size: 1.3rem;
      font-weight: bold;
    }
    .pv-degats { min-width: 1.2rem; text-align: center; color: var(--texte-doux); font-size: 1rem; }
    /* Évasion au milieu, boucliers en dessous */
    .defense {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.6rem;
      margin: 0.8rem 0;
    }
    .evasion { display: flex; flex-direction: column; align-items: center; gap: 0.2rem; }
    .rond-evasion {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 4rem;
      height: 4rem;
      border: 3px solid var(--or);
      border-radius: 50%;
      color: var(--or-clair);
      font-size: 1.9rem;
      font-weight: bold;
    }
    .label-defense { color: var(--texte-doux); font-size: 0.8rem; }
    /* flex-wrap : 12 boucliers passent à la ligne au lieu de déborder */
    .boucliers { display: flex; flex-wrap: wrap; justify-content: center; gap: 0.3rem; }
    .bouclier {
      width: 2.4rem;           /* zone de tap assez grande pour un pouce */
      height: 2.4rem;
      padding: 0.2rem;
      border: none;
      background: none;
    }
    .bouclier svg { width: 100%; height: 100%; }
    .bouclier path { fill: transparent; stroke: var(--accent); stroke-width: 1.6; stroke-linejoin: round; }
    .bouclier.coche path { fill: var(--accent); }

    /* ===== Écran des listes ===== */
    .bloc-liste { margin-bottom: 1rem; }
    .entrees { list-style: none; padding: 0; margin: 0 0 1rem; }
    .entree {
      display: flex;
      justify-content: space-between;   /* nom à gauche, ✕ à droite */
      align-items: center;
      padding: 0.4rem 0;
      border-bottom: 1px solid var(--bordure);
    }
    .entree .secondaire { color: var(--texte-doux); font-size: 0.9rem; }
    .boutons-entree { display: flex; gap: 0.4rem; flex-shrink: 0; }
    .champ textarea { font-family: inherit; resize: vertical; line-height: 1.4; }

    /* ===== Capacités ===== */
    .capacite-edition {
      margin-bottom: 1rem;
      padding: 0.75rem;
      border: 1px solid var(--bordure);
      border-radius: 10px;
    }
    .capacite-edition .barre { align-items: center; margin-bottom: 0.5rem; }
    .label-capacite { color: var(--texte-doux); font-size: 0.9rem; }
    .retirer-capacite {
      width: 2.25rem;
      height: 2.25rem;
      border: 1px solid var(--danger);
      border-radius: 8px;
      background: none;
      color: var(--danger);
    }
    /* ===== Deck de capacités ===== */
    .deck {
      position: relative;            /* repère pour offsetLeft des cartes (JS) */
      display: flex;
      /* pas d'align-items : par défaut "stretch" → toutes les cartes
         prennent la hauteur de la plus haute (la fiche). */
      gap: 0.75rem;
      overflow-x: auto;              /* défilement horizontal */
      scroll-snap-type: x mandatory; /* chaque arrêt se "cale" sur une carte */
      /* Le deck déborde jusqu'aux bords de l'écran (marges négatives =
         annule le padding du body) : la carte garde toute la largeur,
         et on aperçoit le bord de la suivante à droite. */
      margin: 0 -1.5rem;
      padding: 0 1.5rem 0.5rem;
      scroll-padding: 0 1.5rem;      /* la carte se cale à 1.5rem du bord, pas collée */
      scrollbar-width: none;         /* pas de barre de défilement (Firefox) */
    }
    .carte-deck {
      flex: 0 0 100%;                /* largeur d'une carte = largeur du contenu */
      box-sizing: border-box;        /* les 100 % INCLUENT padding et bordure */
      scroll-snap-align: start;
    }
    .deck::-webkit-scrollbar { display: none; }   /* idem (Chrome) */
    /* Carte de capacité : MÉTAL ARGENTÉ au centre, couleurs des domaines
       qui débordent depuis les coins (--d1 haut gauche, --d2 bas droite),
       avec un léger reflet irisé. 4 calques empilés (le 1er listé est DESSUS) :
         1. irisé  : une bande diagonale rose → cyan → jaune très transparente
         2. coin 1 : radial-gradient = tache de couleur qui part du coin
         3. coin 2 : idem, coin opposé
         4. métal  : bandes de gris clairs/sombres en diagonale (≈ métal brossé)
       Chaque calque est une variable à part : la carte de classe doit pouvoir
       leur donner à chacun "padding-box" (voir plus bas).
       radial-gradient(115% 60% at 0% 0%, ...) = ellipse de 115 % de la largeur
       sur 60 % de la hauteur, centrée sur le coin haut gauche.
       Par défaut (classe sans domaines) : coins argentés. */
    .carte-capacite {
      --d1: var(--accent);
      --d2: var(--accent);
      --calque-irise: linear-gradient(115deg,
          transparent 10%,
          rgba(255, 150, 210, 0.05) 32%,
          rgba(140, 225, 255, 0.06) 50%,
          rgba(255, 240, 170, 0.05) 68%,
          transparent 90%);
      --calque-coin1: radial-gradient(115% 60% at 0% 0%,
          color-mix(in srgb, var(--d1) 95%, transparent) 0%,
          color-mix(in srgb, var(--d1) 60%, transparent) 45%,
          transparent 100%);
      --calque-coin2: radial-gradient(115% 60% at 100% 100%,
          color-mix(in srgb, var(--d2) 95%, transparent) 0%,
          color-mix(in srgb, var(--d2) 60%, transparent) 45%,
          transparent 100%);
      --calque-fond: linear-gradient(160deg,
          #5b6068 0%, #3b3f45 20%, #6a7078 38%, #42464d 55%,
          #5e646c 75%, #34373c 100%);
      display: flex;
      flex-direction: column;
      gap: 0.4rem;
      padding: 1rem;
      border: 1px solid #9aa1aa;
      border-radius: 14px;
      background: var(--calque-irise), var(--calque-coin1), var(--calque-coin2), var(--calque-fond);
      /* ombre portée sous le texte : lisible même sur le métal clair */
      text-shadow: 0 1px 3px rgba(0, 0, 0, 0.75);
    }
    /* Carte de CLASSE : bordure dorée de 2px avec un reflet (spéculaire).
       Astuce : une bordure en dégradé ne marche pas avec des coins arrondis,
       alors la bordure est TRANSPARENTE et on peint un fond doré en plus,
       "border-box" (qui va jusque sous la bordure), recouvert par les fonds
       normaux limités au "padding-box" (l'intérieur). Il ne reste visible
       que l'anneau doré de 2px. */
    .carte-capacite[data-type="classe"] {
      border: 2px solid transparent;
      background:
        var(--calque-irise) padding-box,
        var(--calque-coin1) padding-box,
        var(--calque-coin2) padding-box,
        var(--calque-fond) padding-box,
        linear-gradient(135deg,
          #8a6a2c 0%, #e8c878 18%, #fff4d0 24%, #d6b676 32%,
          #8a6a2c 55%, #c9a24f 75%, #f6e2a8 82%, #a8803a 100%) border-box;
    }
    /* Ascendance = doré, communauté = argenté (2 nuances pour un reflet). */
    .carte-capacite[data-type="ascendance"] { --d1: #e8c878; --d2: #a8803a; }
    .carte-capacite[data-type="communaute"] { --d1: #e4e9ec; --d2: #8d989f; }
    /* Titre + texte centrés dans la HAUTEUR : dans une colonne flex,
       margin auto en haut ET en bas = l'espace libre se partage à parts
       égales au-dessus et en dessous du bloc. */
    .corps-capacite { margin: auto 0; }
    /* Appartenance en bas à droite : align-self pousse ce seul élément
       à droite de la colonne ; il reste en bas car il vient après le corps. */
    .carte-capacite .type-capacite { color: #e6e9ed; align-self: flex-end; text-align: right; }
    .pastille-couleur {
      display: inline-block;
      width: 0.8rem;
      height: 0.8rem;
      margin-right: 0.35rem;
      border-radius: 50%;
      vertical-align: middle;
      border: 1px solid rgba(255, 255, 255, 0.3);
    }
    .champ input[type="color"] { height: 3rem; padding: 0.2rem; }
    .carte-capacite strong { display: block; margin-bottom: 0.4rem; text-align: center; color: var(--accent); font-size: 1.15rem; }
    .carte-capacite p { margin: 0; white-space: pre-line; line-height: 1.45; }   /* garde les retours à la ligne */
    .nav-deck {
      position: sticky;              /* reste collée en haut quand on fait défiler la page */
      top: 0;
      z-index: 1;                    /* passe au-dessus des cartes */
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 1.25rem;
      margin: 0 -1.5rem 0.5rem;
      padding: 0.5rem 0;
      background: rgba(18, 19, 21, 0.92);   /* --fond, presque opaque */
    }
    .nav-deck button {
      width: 3rem;
      height: 2.5rem;
      border: 1px solid var(--accent);
      border-radius: 10px;
      background: none;
      color: var(--accent);
      font-size: 1rem;
    }
    .nav-deck button:disabled { opacity: 0.3; }
    #compteur-deck { color: var(--texte-doux); min-width: 7.5rem; text-align: center; }
    .type-capacite { color: var(--texte-doux); font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.05em; }
    .sous-entree { margin-left: 1.25rem; }   /* sous-classes décalées sous leur classe */
    li.sous-entree:not(.entree) { list-style: none; padding: 0.4rem 0; border-bottom: 1px solid var(--bordure); }
    .petit-ajout {
      padding: 0.3rem 0.8rem;
      border: 1px dashed var(--accent);
      border-radius: 8px;
      background: none;
      color: var(--accent);
      font-size: 0.9rem;
    }
    .entree button {
      width: 2.5rem;
      height: 2.5rem;
      border: 1px solid var(--danger);
      border-radius: 8px;
      background: none;
      color: var(--danger);
      font-size: 1rem;
    }
    .entree button.editer { border-color: var(--accent); color: var(--accent); }
    .vide { color: var(--texte-doux); font-style: italic; }
    .aide { color: var(--texte-doux); font-size: 0.85rem; font-style: italic; }
    /* ===== Création : jetons de caracs ===== */
    .reserve {
      display: flex;
      flex-wrap: wrap;          /* passe à la ligne si trop de jetons */
      align-items: center;
      gap: 0.5rem;
      margin: 0.5rem 0 0.75rem;
    }
    .jeton {
      min-width: 3rem;
      height: 2.75rem;
      border: 2px solid var(--accent);
      border-radius: 999px;
      background: none;
      color: var(--accent);
      font-size: 1.1rem;
    }
    .jeton.choisi { background: var(--accent); color: var(--fond); }   /* "dans la main" */
    .cases { display: flex; flex-direction: column; gap: 0.4rem; }
    /* Mode jeu : grille compacte 3 × 2 (label en petit, valeur dessous).
       repeat(3, 1fr) = 3 colonnes de même largeur. */
    .cases.compactes { display: grid; grid-template-columns: repeat(3, 1fr); gap: 0.35rem; }
    .cases.compactes .case-carac {
      flex-direction: column;
      gap: 0.1rem;
      padding: 0.4rem 0.2rem;
    }
    .cases.compactes .label-carac { font-size: 0.8rem; color: var(--texte-doux); }
    .cases.compactes .valeur { font-size: 1.15rem; }
    .case-carac {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0.7rem 1rem;
      border: 1px solid var(--bordure);
      border-radius: 10px;
      background: var(--carte-creux);
      color: var(--texte);
      font-size: 1rem;
    }
    .case-carac .valeur { color: var(--accent); font-size: 1.2rem; }
    .case-carac.vide { border-style: dashed; color: var(--texte-doux); }
    .cases.en-attente .case-carac { border-color: var(--accent); }   /* invite à poser */
    .case-carac.ouverte { border-color: var(--accent); }
    .buff   { color: var(--accent-clair); }
    .debuff { color: var(--danger); }
    .plein  { width: 100%; margin-top: 0.75rem; }
    .texte p { line-height: 1.5; color: var(--texte); }
    .texte a { color: var(--accent); }
    /* Nom à gauche, pastille de niveau à droite */
    .ligne-nom {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 0.5rem;
    }
    .niveau {
      flex-shrink: 0;            /* le cercle ne s'écrase jamais, même avec un long nom */
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 2rem;
      height: 2rem;
      border: 2px solid var(--or);
      border-radius: 50%;        /* carré + 50 % = cercle */
      color: var(--or);
      font-size: 1rem;
      font-weight: bold;
    }
    .badge {
      font-size: 0.75rem;
      font-weight: normal;
      padding: 0.1rem 0.5rem;
      border: 1px solid var(--texte-doux);
      border-radius: 999px;   /* très grand rayon = pilule */
      color: var(--texte-doux);
      vertical-align: middle;
    }
  </style>
</head>
<body>
  <h1>Duality Companion</h1>

  <!-- Zone vide : app.js va la remplir avec la fiche du personnage -->
  <div id="app"></div>

  <!-- Sélecteur de fichier pour l'import, caché : on le déclenche depuis
       le bouton "Importer". Il est HORS de #app, sinon rendre() le détruirait.
       Pas d'attribut accept=".json" : sur certains Android, le sélecteur
       grise alors les .json qu'il ne reconnaît pas. -->
  <input type="file" id="fichier-import" hidden>

  <!-- On charge le script. "defer" = attendre que la page soit construite
       avant de l'exécuter, sinon il ne trouverait pas <div id="app"> -->
  <!-- ?v=2 : numéro de version. Le changer force le navigateur à
       recharger app.js au lieu de servir sa vieille copie en cache. -->
  <script src="app.js?v=48" defer></script>

  <!-- Enregistre le service worker (sw.js) : réseau d'abord + hors-ligne.
       "if" : les vieux navigateurs sans service worker ignorent simplement. -->
  <script>
    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("sw.js");
    }
  </script>
</body>
</html>
